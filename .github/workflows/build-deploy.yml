name: Build & Deploy

# daily: the pipeline finished — build the homepage, the newest two editions,
#        any edition the deploy manifest does not list yet, and their articles.
# full:  code changed, a person asked, or the weekly rebuild — build everything.
# Both then export data/sitemaps/RSS, verify, and upload. See docs/build-data.md.

on:
  repository_dispatch:
    # pipeline-done: ahaIndexSync sends this after its pipeline completes (daily)
    # external-workflow-complete: other repos call POST .../dispatches when their workflow finishes (daily)
    # build-deploy: manual / legacy dispatch (full)
    types:
      - build-deploy
      - external-workflow-complete
      - pipeline-done
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  schedule:
    # Sundays 03:17 Beijing time: refreshes project pages and anything the pipeline revised.
    - cron: '17 19 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full rebuilds every page; daily builds only what a new edition changes'
        type: choice
        options: [full, daily]
        default: full
      cleanup:
        description: 'Full builds only: list or delete OSS objects that no deploy writes any more'
        type: choice
        options: [dry-run, none, delete]
        default: dry-run

concurrency:
  group: production-build-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_BUILD_KEY: ${{ secrets.SUPABASE_BUILD_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REQUESTED_MODE: ${{ (github.event_name == 'repository_dispatch' && github.event.action != 'build-deploy') && 'daily' || (github.event_name == 'workflow_dispatch' && inputs.mode) || 'full' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Install ossutil
        run: |
          curl -Lo ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.2.1/ossutil-2.2.1-linux-amd64.zip
          unzip ossutil.zip
          chmod +x ossutil-2.2.1-linux-amd64/ossutil
          sudo mv ossutil-2.2.1-linux-amd64/ossutil /usr/local/bin/ossutil

      - name: Fetch the deploy manifest
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          mkdir -p .deploy
          ossutil cp oss://amazingindex/_deploy/manifest.json .deploy/manifest.prev.json --force \
            --endpoint https://oss-cn-hangzhou.aliyuncs.com --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET" --region cn-hangzhou \
            || echo "No deploy manifest yet: this run builds the full site"

      - name: Plan the build
        run: npm run plan:build -- --mode "$REQUESTED_MODE" --manifest .deploy/manifest.prev.json --out .deploy/plan.json

      - name: Verify community service and build
        run: |
          npm run verify:community:service
          npm run build
        env:
          PUBLIC_COMMUNITY_ENABLED: ${{ vars.PUBLIC_COMMUNITY_ENABLED }}
          PUBLIC_COMMUNITY_SUPABASE_URL: ${{ vars.PUBLIC_COMMUNITY_SUPABASE_URL }}
          PUBLIC_COMMUNITY_SUPABASE_KEY: ${{ vars.PUBLIC_COMMUNITY_SUPABASE_KEY }}
          PUBLIC_COMMUNITY_TURNSTILE_KEY: ${{ vars.PUBLIC_COMMUNITY_TURNSTILE_KEY }}

      - name: Export data, sitemaps and RSS
        run: npm run export:data -- --dist dist --out export --mode "$BUILD_MODE" --prev-manifest .deploy/manifest.prev.json

      - name: Verify pages and export
        run: npm run verify:site -- --dist dist --export export

      - name: Deploy to OSS and refresh the CDN
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          CLEANUP: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup || (github.event_name == 'schedule' && 'dry-run') || 'none' }}
        run: |
          set -euo pipefail
          ossutil rm oss://amazingindex/__test__/ --recursive --force \
            --endpoint https://oss-cn-hangzhou.aliyuncs.com --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET" --region cn-hangzhou || true
          pip install alibabacloud_cdn20180510 --quiet
          bash scripts/deploy-oss.sh
