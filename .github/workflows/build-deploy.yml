name: Build & Deploy

# Daily build: the homepage, the newest two editions, editions the deploy
# manifest is missing (and the one before each), their articles, and every
# page that needs no data. Project pages and older editions are only rebuilt
# by full-build.yml.

on:
  repository_dispatch:
    # pipeline-done: ahaIndexSync sends this after its pipeline completes
    # external-workflow-complete: other repos call POST .../dispatches when their workflow finishes
    # build-deploy: manual / legacy dispatch
    types:
      - build-deploy
      - external-workflow-complete
      - pipeline-done
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Shared with full-build.yml: one production deploy at a time. GitHub keeps
# one pending run per group, so a newer trigger replaces a waiting one.
concurrency:
  group: production-build-deploy
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      mode: daily
    secrets: inherit
