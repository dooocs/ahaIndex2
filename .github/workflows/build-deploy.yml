name: Build & Deploy

# Daily build: the newest edition and the one before it, their articles, and
# the pages that need no data; data, sitemaps and RSS are updated
# incrementally. Older editions and project pages are only rebuilt by
# full-build.yml. Never turns into a full build on its own.

on:
  repository_dispatch:
    # pipeline-done: ahaIndexSync sends this after its pipeline completes
    # external-workflow-complete: other repos call POST .../dispatches when their workflow finishes
    # build-deploy: manual / legacy dispatch
    types:
      - build-deploy
      - external-workflow-complete
      - pipeline-done
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Also build editions that are missing from OSS: "missing" finds them (at most 16 editions per run), or list dates (2026-10-01,2026-10-02)'
        type: string
        default: ''

# Shared with full-build.yml: one production deploy at a time. GitHub keeps
# one pending run per group, so a newer trigger replaces a waiting one.
concurrency:
  group: production-build-deploy
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      mode: daily
      backfill: ${{ inputs.backfill || '' }}
    secrets: inherit
