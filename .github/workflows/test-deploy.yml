name: Test Deploy (Staging)

# A full build uploaded under oss://amazingindex/__test__/, without touching
# the production manifest or the CDN. The next production deploy removes it.
# It checks that a build, export and upload succeed. It is not a visual
# preview: pages under __test__/ load /_astro/ and /data/ from the site root.
# To look at a build, run `npm run preview:site` locally (docs/build-data.md).

on:
  workflow_dispatch:  # 只能手动触发

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_BUILD_KEY: ${{ secrets.SUPABASE_BUILD_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BUILD_MODE: full
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Verify community service and build
        run: |
          npm run verify:community:service
          npm run build
        env:
          PUBLIC_COMMUNITY_ENABLED: ${{ vars.PUBLIC_COMMUNITY_ENABLED }}
          PUBLIC_COMMUNITY_SUPABASE_URL: ${{ vars.PUBLIC_COMMUNITY_SUPABASE_URL }}
          PUBLIC_COMMUNITY_SUPABASE_KEY: ${{ vars.PUBLIC_COMMUNITY_SUPABASE_KEY }}
          PUBLIC_COMMUNITY_TURNSTILE_KEY: ${{ vars.PUBLIC_COMMUNITY_TURNSTILE_KEY }}

      - name: Export data, sitemaps and RSS
        run: npm run export:data -- --dist dist --out export --mode full

      - name: Verify pages and export
        run: npm run verify:site -- --dist dist --export export

      - name: Install ossutil
        run: |
          curl -Lo ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.2.1/ossutil-2.2.1-linux-amd64.zip
          unzip ossutil.zip
          chmod +x ossutil-2.2.1-linux-amd64/ossutil
          sudo mv ossutil-2.2.1-linux-amd64/ossutil /usr/local/bin/ossutil

      - name: Deploy to OSS (staging)
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          DEPLOY_PREFIX: __test__/
          SKIP_CDN: '1'
        run: |
          set -euo pipefail
          ossutil rm oss://amazingindex/__test__/ --recursive --force \
            --endpoint https://oss-cn-hangzhou.aliyuncs.com --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET" --region cn-hangzhou || true
          bash scripts/deploy-oss.sh
