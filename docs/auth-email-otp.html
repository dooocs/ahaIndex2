<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><title>向上研究所登录验证码</title></head>
  <body style="margin:0;padding:32px 20px;background:#efe9df;color:#1c1814;font-family:Arial,sans-serif;line-height:1.8">
    <main style="max-width:480px;margin:0 auto">
      <p style="color:#a83226;font-size:14px">向上研究所 · AMAZINGINDEX.COM</p>
      <h1 style="font-size:24px">邮箱登录验证码</h1>
      <p>请在网站的「邮箱登录」页面输入以下验证码：</p>
      <p style="font-family:monospace;font-size:36px;letter-spacing:8px"><strong>{{ .Token }}</strong></p>
      <p>验证码 10 分钟内有效，请勿向他人透露。</p>
      <p style="font-size:12px"><a href="{{ .ConfirmationURL }}" style="color:#a83226">也可点击此处直接登录</a></p>
      <p style="font-size:12px;color:#625d56">如果你没有申请登录，请忽略此邮件。</p>
    </main>
  </body>
</html>
