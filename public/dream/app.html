@font-face{font-family:"Barlow Condensed";font-weight:500;font-display:swap;src:url(/dream/fonts/barlow-condensed-500.woff2) format("woff2")}

<body>
<style>
/* 布局：竖屏单栏 —— 顶部数字条 / 中间 3D 舞台 / 底部抽屉；桌面端居中成一部"手机" */
:root{
  --bg:#E7ECEF;          /* 雾蓝灰，像清晨的天 */
  --panel:#F7F9FA;
  --ink:#1C2630;
  --muted:#5E6B77;
  --line:#CBD3DA;
  --accent:#E27A3F;      /* 日出橙：强调与"已选" */
  --accent-soft:#F6DCCB;
  --good:#2F8F6B;
  --stage-top:#DCE6EC;
  --stage-bottom:#EEF1EC;
  --f-display:"ZCOOL XiaoWei","Songti SC","STSong",serif;
  --f-num:"Barlow Condensed","DIN Alternate","Arial Narrow",sans-serif;
  --f-body:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161C;--panel:#18212A;--ink:#E4EAEF;--muted:#94A1AD;--line:#2B3742;
  --accent:#F0955C;--accent-soft:#3E2A1E;--good:#5CC49B;--stage-top:#15202A;--stage-bottom:#1B2621;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161C;--panel:#18212A;--ink:#E4EAEF;--muted:#94A1AD;--line:#2B3742;
  --accent:#F0955C;--accent-soft:#3E2A1E;--good:#5CC49B;--stage-top:#15202A;--stage-bottom:#1B2621;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);margin:0;overflow:hidden}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px}
header h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.04em}
header h1 small{font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-left:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:4px 8px}
.stat{min-width:0}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stat .v{font-family:var(--f-num);font-weight:600;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v em{font-style:normal;font-size:14px;margin-left:1px;color:var(--muted)}
.years{display:flex;gap:14px;align-items:baseline;font-size:12px;color:var(--muted);padding-block:0 8px;flex-wrap:wrap}
.years b{font-family:var(--f-num);font-size:20px;color:var(--accent);font-weight:600;margin:0 2px}
.years button{margin-left:auto;font:inherit;font-size:12px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.stage{position:relative;flex:1;min-height:220px;background:linear-gradient(var(--stage-top),var(--stage-bottom));overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.badge{position:absolute;top:8px;right:max(8px,env(safe-area-inset-right,0px));font:11px/1.3 var(--f-body);color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);border-radius:6px;padding:3px 6px;font-variant-numeric:tabular-nums}
.back{position:absolute;top:8px;left:max(8px,env(safe-area-inset-left,0px));font:12px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);color:var(--panel);font-size:12px;border-radius:999px;padding:6px 12px;white-space:nowrap;opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
.fallback{position:absolute;inset:0;overflow:auto;padding:12px}
.fallback h3{font-size:12px;color:var(--muted);margin:10px 0 6px;font-weight:500}
.fallback .cards{display:flex;flex-wrap:wrap;gap:6px}
.fallback .cards span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}
.drawer{background:var(--panel);border-top:1px solid var(--line);padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-height:44%;min-height:0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;font:inherit;font-size:14px;color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;background:var(--bg)}
.tabs button .n{font-family:var(--f-num);font-size:12px;color:var(--accent);margin-left:3px}
.pane{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.group h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;text-align:left}
.chip small{font-family:var(--f-num);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip small i{font-style:normal;font-family:var(--f-body);font-size:10px;margin-left:4px;color:var(--muted);opacity:.8}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip[aria-pressed="true"] small{color:var(--ink)}
.qty{display:inline-flex;align-items:center;gap:6px;margin-top:4px}
.qty button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:14px;line-height:1;padding:0}
.qty span{font-family:var(--f-num);font-size:15px;min-width:16px;text-align:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field input{font:inherit;font-family:var(--f-num);font-size:18px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:100%;box-sizing:border-box}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.poster{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.poster[hidden]{display:none}
.poster img{max-width:min(360px,100%);max-height:78vh;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.poster p{font-size:12px;color:var(--muted);margin:0}
.poster button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.tilt{position:absolute;left:0;right:0;height:22%;pointer-events:none;display:none;-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px)}
.tilt.top{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.tilt.bottom{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.stage.hi .tilt{display:block}
.qseg{position:absolute;left:max(8px,env(safe-area-inset-left,0px));bottom:10px;z-index:2}
.qseg button{font-size:11px;padding:4px 9px}
.years button:disabled{opacity:.6;cursor:progress}
.zlabels{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.zlabel{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ink);font:600 13px/1.2 var(--f-body);cursor:pointer;white-space:nowrap;box-shadow:0 4px 14px rgba(20,30,40,.08);will-change:transform}
.zlabel small{font:600 12px var(--f-num);color:var(--accent);letter-spacing:.02em}
.zlabel:hover{border-color:var(--accent)}
.tip{position:absolute;left:0;top:0;z-index:4;pointer-events:none;background:var(--ink);color:var(--panel);border-radius:10px;padding:7px 11px;display:flex;flex-direction:column;gap:2px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.tip b{font-weight:600;font-size:13px}.tip span{font-family:var(--f-num);font-size:14px;opacity:.8}
.stage.post .tilt{display:none}
#btn-back{display:none!important}
.crumbs{position:absolute;top:8px;left:max(8px,env(safe-area-inset-left,0px));z-index:3;display:flex;align-items:center;gap:2px;flex-wrap:wrap;max-width:calc(100% - 16px);box-sizing:border-box;padding:4px 6px 4px 4px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--panel) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:13px;box-shadow:0 4px 14px rgba(20,30,40,.08)}
.crumbs button{border:0;background:none;color:var(--muted);font:inherit;padding:5px 9px;border-radius:999px;cursor:pointer}
.crumbs button:hover{color:var(--ink);background:var(--bg)}
.crumbs button.up{font-size:17px;line-height:1;color:var(--ink);padding:3px 10px}
.crumbs button[aria-current="page"]{color:var(--ink);font-weight:600;cursor:default;background:none}
.crumbs i{font-style:normal;color:var(--muted);opacity:.55}
.crumbs .sum{color:var(--muted);padding:0 8px 0 10px;margin-left:4px;border-left:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.hotspots{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.hotspot{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:7px;border:0;background:var(--ink);color:var(--panel);font:600 13px/1 var(--f-body);padding:8px 12px 8px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:0 8px 22px rgba(20,30,40,.22);will-change:transform}
.hotspot .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:hsPulse 2.2s ease-out infinite}
.hotspot .go{font-size:16px;opacity:.8}
.hotspot:hover{background:var(--accent);color:#1c2630}
@keyframes hsPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent) 0%,transparent)}}
.fade{position:absolute;inset:0;z-index:2;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .34s ease}
.fade.on{opacity:1}
@media (prefers-reduced-motion: reduce){.hotspot .dot{animation:none}.fade{transition:none}}
@media (min-width:900px){
  .app{max-width:none;display:block;position:relative}
  .stage{position:absolute;inset:0;min-height:0}
  header,.hud,.years{position:absolute;left:0;z-index:3;width:min(600px,48vw);box-sizing:border-box;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:0}
  header{top:20px;width:auto;justify-content:flex-start;gap:28px}header h1{font-size:32px}
  .hud{width:auto}.years{width:auto}.years button{margin-left:24px}
  .hud{top:76px;display:flex;gap:44px}.stat .k{font-size:13px}.stat .v{font-size:48px}.stat .v em{font-size:18px}
  .years{top:170px;font-size:14px}.years b{font-size:26px}
  .drawer{position:absolute;right:max(20px,env(safe-area-inset-right,0px));top:20px;bottom:20px;width:380px;box-sizing:border-box;max-height:none;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 84%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);box-shadow:0 20px 50px rgba(20,30,40,.14);z-index:3}
  .badge{top:auto;bottom:26px;right:430px}
  .qseg{left:32px;bottom:24px}
  .back{top:226px;left:32px}
  .crumbs{top:226px;left:32px;max-width:calc(100% - 480px)}
  .app.info-off .crumbs{top:20px}
  .info-btn{top:20px;right:max(20px,env(safe-area-inset-right,0px))}
  .app:not(.info-off) .drawer{top:72px}
  .app.scene-dark header h1,.app.scene-dark .stat .v,.app.scene-dark .years{color:#eef2f6}
  .app.scene-dark header h1 small,.app.scene-dark .stat .k,.app.scene-dark .stat .v em{color:rgba(238,242,246,.66)}
  .app.scene-dark .years button{color:#eef2f6;border-color:rgba(238,242,246,.3);background:rgba(255,255,255,.06)}
  .app.scene-dark header,.app.scene-dark .hud,.app.scene-dark .years{text-shadow:0 1px 12px rgba(0,0,0,.35)}
  .toast{left:calc(50% - 210px);bottom:28px}
  .fallback{padding:240px 430px 20px 32px}
  .stage canvas{cursor:grab}
}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
/* 默认只看 3D：数字、清单、标签、画质和风格切换都收起来；右上角 i 打开价格 */
.qseg,.badge,header .seg{display:none!important}
/* ?perf 时显示帧率角标（排查用） */
.app.perf .badge{display:block!important}
/* 显卡提示：只在检测到软件渲染、或集成显卡且已自动降清晰度时出现，可关闭 */
.gpuhint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;z-index:5;max-width:340px;box-sizing:border-box;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--panel) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);font:13px/1.55 var(--f-body);box-shadow:0 10px 30px rgba(20,30,40,.12)}
.gpuhint b{display:block;font-size:14px;margin-bottom:4px}
.gpuhint p{margin:0;color:var(--muted)}
.gpuhint ol{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.gpuhint .row{display:flex;gap:8px;margin-top:10px}
.gpuhint button{font:600 12px/1 var(--f-body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.gpuhint button.pri{background:var(--ink);color:var(--panel);border-color:var(--ink)}
@media (min-width:900px){.gpuhint{left:32px;bottom:24px}}
.app.info-off header,.app.info-off .hud,.app.info-off .years,.app.info-off .drawer,.app.info-off .zlabels,.app.info-off .crumbs .sum,.app.info-off .tip span{display:none!important}
.info-btn{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));z-index:6;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--ink);font:italic 600 18px/1 Georgia,"Times New Roman",serif;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,color .2s}
.info-btn:hover{background:var(--ink);color:var(--panel)}
.app:not(.info-off) .info-btn{background:var(--ink);color:var(--panel)}
.app.scene-dark .info-btn{border-color:rgba(238,242,246,.28);color:#eef2f6;background:rgba(255,255,255,.08)}
.app.scene-dark:not(.info-off) .info-btn,.app.scene-dark .info-btn:hover{background:#eef2f6;color:#1c2630}
</style>

<div class="app info-off">
  <header class="gut">
    <h1>梦想人生<small>向上研究所 · beta</small></h1>

<script>
// ===== 价格库（原型内置）。verified=true 为已核实官方价，其余为示例价格 =====
const ZONES=[
  {id:'home',name:'家',angle:0},
  {id:'go',name:'出行',angle:72},
  {id:'dream',name:'梦想',angle:144},
  {id:'sport',name:'运动',angle:216},
  {id:'hobby',name:'爱好',angle:288},
  {id:'carry',name:'随身',angle:null},
];
// kind: one 一次性 | cycle 周期更换 | month 每月 | year 每年 | loan 首付+月供
const CATALOG=[
  {id:'apt',zone:'home',type:'住宅',name:'杭州 · 大平层',price:3000000,kind:'loan',model:'apartment'},
  {id:'macstudio',zone:'home',place:'home.study',type:'台式主机',name:'Mac Studio',price:15999,kind:'cycle',cycle:48,model:'desktop'},
  {id:'gamepc',zone:'home',place:'home.study',type:'台式主机',name:'自配 Windows 游戏主机',price:15000,kind:'cycle',cycle:48,model:'tower'},
  {id:'studiodisplay',zone:'home',place:'home.study',type:'显示器',name:'Studio Display',price:11499,kind:'cycle',cycle:60,model:'monitor'},

function monthlyPay(P,r,n){if(r===0)return P/n;const k=Math.pow(1+r,n);return P*r*k/(k-1)}
function compute(items,priv){
  let S=0,A=0,L=0,full=0;
  for(const [id,q] of Object.entries(items)){
    const c=BY_ID[id];if(!c||!q)continue;const p=c.price*q;
    if(c.kind==='one'){S+=p;full+=p}
    else if(c.kind==='loan'){S+=LOAN.down*p;full+=p;L+=12*monthlyPay((1-LOAN.down)*p,LOAN.rate/12,LOAN.years*12)}
    else if(c.kind==='cycle'){A+=12*p/c.cycle}
    else if(c.kind==='month'){A+=12*p}
    else if(c.kind==='year'){A+=p}
    if(c.run)A+=c.run*q;
  }
  const T=full+25*A, monthly=(A+L)/12;
  const s=priv.save, W=priv.assets;
  const yrs=x=>s>0?Math.max(0,x-W)/(12*s):null;
  return {S,A,L,T,monthly,nBuy:yrs(S),nFree:yrs(T)};
}

const texCache={};
function noiseTex(key,base,spread,size=256,speck=0.5){
  if(texCache[key])return texCache[key];
  const cv=document.createElement('canvas');cv.width=cv.height=size;const x=cv.getContext('2d');
  const c=new THREE.Color(base);x.fillStyle='#'+c.getHexString();x.fillRect(0,0,size,size);
  let seed=key.length*9301+49297;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<size*size*speck/6;i++){const v=(rnd()-0.5)*spread,cc=c.clone().offsetHSL(0,0,v);x.fillStyle='#'+cc.getHexString();const r=rnd()*2.2+0.6;x.fillRect(rnd()*size,rnd()*size,r,r)}
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;texCache[key]=t;return t;
}

  const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d');const img=x.createImageData(s,s);

  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;texCache.bump=t;return t;
}
function blobTex(){

const geoCache=new Map();

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function smoothNormals(g,deg=55){
  const pos=g.attributes.position,nor=g.attributes.normal,n=pos.count,map=new Map(),cos=Math.cos(deg*D2R);
  for(let i=0;i<n;i++){const k=Math.round(pos.getX(i)*1e4)+','+Math.round(pos.getY(i)*1e4)+','+Math.round(pos.getZ(i)*1e4);let l=map.get(k);if(!l){l=[];map.set(k,l)}l.push(i)}
  const out=new Float32Array(n*3),a=new THREE.Vector3(),b=new THREE.Vector3(),s=new THREE.Vector3();
  for(const ids of map.values())for(const i of ids){a.fromBufferAttribute(nor,i);s.set(0,0,0);for(const j of ids){b.fromBufferAttribute(nor,j);if(a.dot(b)>=cos)s.add(b)}s.normalize();out[i*3]=s.x;out[i*3+1]=s.y;out[i*3+2]=s.z}
  g.setAttribute('normal',new THREE.BufferAttribute(out,3));return g;
}
function rboxGeo(w,h,d,r){return cached(`rb${w}|${h}|${d}|${r}`,()=>{
  r=Math.max(0.003,Math.min(r,w/2*0.98,h/2*0.98,d/2*0.98));
  const b=r*0.7,cw=w-2*b,ch=h-2*b,cr=Math.max(0.001,Math.min(r-b,cw/2*0.98,ch/2*0.98)),x=-cw/2,y=-ch/2,s=new THREE.Shape();
  s.moveTo(x+cr,y);s.lineTo(x+cw-cr,y);s.quadraticCurveTo(x+cw,y,x+cw,y+cr);s.lineTo(x+cw,y+ch-cr);s.quadraticCurveTo(x+cw,y+ch,x+cw-cr,y+ch);s.lineTo(x+cr,y+ch);s.quadraticCurveTo(x,y+ch,x,y+ch-cr);s.lineTo(x,y+cr);s.quadraticCurveTo(x,y,x+cr,y);
  const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(0.001,d-2*b),bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:4});
  g.translate(0,0,-(d-2*b)/2);return smoothNormals(g);})}
const rb=(w,h,d,r,c,x,y,z,k)=>mesh(rboxGeo(w,h,d,r),c,x,y,z,k);
const latheGeo=(pts,seg=32)=>new THREE.LatheGeometry(pts.map(([r,y])=>new THREE.Vector2(r,y)),seg);

// 把一个模型里同材质的静态网格合并成一次绘制
function mergeStatic(g){
  g.updateMatrixWorld(true);const inv=new THREE.Matrix4().copy(g.matrixWorld).invert(),buckets=new Map(),drop=[];
  g.traverse(o=>{if(!o.isMesh||Array.isArray(o.material)||o.material.transparent||!o.material.isMeshStandardMaterial)return;
    const geo=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();geo.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld));
    const k=o.material.uuid;if(!buckets.has(k))buckets.set(k,{m:o.material,geos:[]});buckets.get(k).geos.push(geo);drop.push(o)});
  drop.forEach(o=>o.parent.remove(o));
  buckets.forEach(({m,geos})=>{let n=0;geos.forEach(q=>n+=q.attributes.position.count);
    const pos=new Float32Array(n*3),nor=new Float32Array(n*3),uv=new Float32Array(n*2);let off=0;
    geos.forEach(q=>{pos.set(q.attributes.position.array,off*3);if(q.attributes.normal)nor.set(q.attributes.normal.array,off*3);if(q.attributes.uv)uv.set(q.attributes.uv.array,off*2);off+=q.attributes.position.count;q.dispose()});
    const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.BufferAttribute(pos,3));G.setAttribute('normal',new THREE.BufferAttribute(nor,3));G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const M=new THREE.Mesh(G,m);M.castShadow=M.receiveShadow=HI();g.add(M)});
  return g;
}

const HEADG=(()=>{let C=null;return()=>{if(C)return C;const A=HEAD_ASSET,lo=A.lo,hi=A.hi,o={};
  const buf=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
  for(const k in A.parts){const e=A.parts[k],q=new Uint16Array(buf(e.p)),n=new Int8Array(buf(e.n)),P=new Float32Array(q.length),N=new Float32Array(n.length);
    for(let i=0;i<q.length;i++){const c=i%3;P[i]=lo[c]+q[i]/65535*(hi[c]-lo[c]);N[i]=n[i]/127}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('normal',new THREE.BufferAttribute(N,3));g.setIndex(new THREE.BufferAttribute(new Uint16Array(buf(e.i)),1));g.computeBoundingSphere();o[k]=g}
  o.eye.computeBoundingBox();const ec=new THREE.Vector3();o.eye.boundingBox.getCenter(ec);o.eyeC=ec;o.eye.translate(-ec.x,-ec.y,-ec.z);o.hi.translate(-ec.x,-ec.y,-ec.z);
  return C=o}})();

function hairShell(style){return cached('hshell'+style,()=>{const s=HEADG().skin,P=s.attributes.position,N=s.attributes.normal,I=s.index.array;
  const off=style==='buzz'?0.008:0.017,backDrop=style==='buzz'?0.085:0.14;
  const thr=z=>{const f=Math.min(1,Math.max(0,(z-0.02)/0.12)),b=Math.min(1,Math.max(0,(-z-0.02)/0.1));return 0.272+f*0.08-b*backDrop};
  const keep=[],map=new Map(),pos=[],nor=[];
  for(let t=0;t<I.length;t+=3){let cy=0,cz=0;for(let k=0;k<3;k++){cy+=P.getY(I[t+k]);cz+=P.getZ(I[t+k])}cy/=3;cz/=3;if(cy<thr(cz))continue;
    for(let k=0;k<3;k++){const v=I[t+k];if(!map.has(v)){map.set(v,pos.length/3);pos.push(P.getX(v)+N.getX(v)*off,P.getY(v)+N.getY(v)*off,P.getZ(v)+N.getZ(v)*off);nor.push(N.getX(v),N.getY(v),N.getZ(v))}keep.push(map.get(v))}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));g.setIndex(keep);return g})}

function animAvatar(A,now){const P=A.P,[R,L]=A.arms;
  A.torso.scale.set(1+Math.sin(now/900)*0.006,1+Math.sin(now/900)*0.012,1);
  A.neck.rotation.y=(P.hy||0)+Math.sin(now/2300)*(A.pose==='stand'||A.pose==='relax'?0.16:0.06);A.neck.rotation.x=(P.head||0)+Math.sin(now/3100)*0.035;
  const t=now-A.next;A.eyes.scale.y=t>0&&t<130?0.12:1;if(t>130)A.next=now+2600+Math.random()*2600;
  if(A.pose==='sit'){R.el.rotation.x=P.el[0]+Math.max(0,Math.sin(now/95))*0.05;L.el.rotation.x=P.el[1]+Math.max(0,Math.sin(now/95+1.7))*0.05}
  else if(A.pose==='game'){const q=Math.sin(now/1700);A.spine.rotation.z=q*0.035;R.wr.rotation.z=Math.sin(now/120)*0.04;L.wr.rotation.z=Math.sin(now/150+1)*0.04}
  else if(A.pose==='relax'){ // 时不时喝一口咖啡；翘着的那只脚轻轻点
    const c=window.__noSip?0:(now%7000)/7000,s=c>0.72&&c<0.96?Math.sin((c-0.72)/0.24*Math.PI):0;L.sh.rotation.x=P.sh[1][0]-s*0.55;L.el.rotation.x=P.el[1]-s*0.5;A.neck.rotation.x=(P.head||0)-s*0.12;
    A.legs[1].kn.rotation.x=P.kn[1]+Math.sin(now/520)*0.06}
  else if(A.pose==='lift'){const q=now/650;R.el.rotation.x=-(0.3+Math.max(0,Math.sin(q))*1.9);L.el.rotation.x=-(0.3+Math.max(0,Math.sin(q+Math.PI))*1.9)}
  else if(A.pose==='hike'){const sn=Math.sin(now/330);A.legs[0].hip.rotation.x=sn*0.42;A.legs[1].hip.rotation.x=-sn*0.42;A.legs[0].kn.rotation.x=0.1+Math.max(0,-Math.cos(now/330))*0.55;A.legs[1].kn.rotation.x=0.1+Math.max(0,Math.cos(now/330))*0.55;
    R.sh.rotation.x=-0.1-sn*0.32;L.sh.rotation.x=-0.1+sn*0.32}
  if(A.waveArm){const W=A.waveArm,w=A.wave?(now-A.wave)/1600:1;
    if(w<1){const env=Math.sin(w*Math.PI);W.sh.rotation.x=-env*0.4;W.sh.rotation.z=W.s*(0.15+env*2.4);W.el.rotation.x=-env*0.5;W.wr.rotation.z=Math.sin(now/90)*0.45*env}
    else{const i=W===R?0:1;W.sh.rotation.set(P.sh[i][0],P.sh[i][2]*W.s,P.sh[i][1]*W.s);W.wr.rotation.z=0}}
}

const ROCK=0x9b8c7d;
function rockGeo(seed,scale=1){return cached('rock'+seed+scale,()=>{const g=latheGeo([[1.47,0.02],[1.44,-0.1],[1.3,-0.3],[1.05,-0.55],[0.7,-0.8],[0.35,-1.0],[0.1,-1.1],[0,-1.12]].reverse().map(([r,y])=>[r*scale,y*scale]),18);
  const p=g.attributes.position,R=rng(seed);const jit=new Map();
  for(let i=0;i<p.count;i++){const y=p.getY(i);if(y>-0.12*scale)continue;const k=Math.round(p.getX(i)*500)+','+Math.round(y*500)+','+Math.round(p.getZ(i)*500);let f=jit.get(k);if(f===undefined){f=1+(R()-0.5)*0.22;jit.set(k,f)}p.setX(i,p.getX(i)*f);p.setZ(i,p.getZ(i)*f);p.setY(i,y+(R()-0.5)*0.03*scale)}
  g.computeVertexNormals();return g})}
function island2(zid,seed){
  const grp=new THREE.Group(),col=new THREE.Color(ISLE_COL[zid]).offsetHSL(0,0.1,-0.07).getHex();
  const topMat=new THREE.MeshStandardMaterial({color:0xffffff,map:noiseTex('isle2'+zid,col,0.08,256,0.9),roughness:mode==='clay'?1:0.9,bumpMap:bumpTex(),bumpScale:0.01});topMat.map.repeat.set(2,2);
  const top=mesh(cached('itop',()=>latheGeo([[0,0.175],[1.38,0.175],[1.46,0.165],[1.5,0.13],[1.5,0.06],[1.47,0.02]].reverse(),48)),topMat,0,0,0);top.userData.zone=zid;grp.add(top);
  grp.add(mesh(rockGeo(seed),ROCK,0,0,0,'rock'));
  const deco=new THREE.Group(),R=rng(seed*7+3);
  for(let i=0;i<8;i++){const a=R()*Math.PI*2,r=1.18+R()*0.22,x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(i<5){[0,1,2].forEach(j=>{const b=mesh(cached('blade',()=>new THREE.ConeGeometry(0.03,0.16,5)),0x6f9a58,x+(j-1)*0.035,0.24,z+(j%2)*0.02,'leaf');b.rotation.z=(j-1)*0.35;deco.add(b)})}
    else deco.add(sph(0.05+R()*0.03,0xb3aaa0,x,0.19,z,'rock',1.2,0.6,1))}
  grp.add(mergeStatic(deco));
  return {group:grp,top};
}

  const cv=document.createElement('canvas');cv.width=512;cv.height=224;const x=cv.getContext('2d');x.scale(2,2);
  x.fillStyle=css('--panel')||'#fff';x.globalAlpha=0.94;x.beginPath();x.roundRect?x.roundRect(8,8,240,96,24):x.rect(8,8,240,96);x.fill();x.globalAlpha=1;
  x.fillStyle=css('--ink')||'#1c2630';x.font='600 44px "PingFang SC","Microsoft YaHei",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,128,sub?46:56);
  if(sub){x.fillStyle=css('--accent')||'#e27a3f';x.font='600 26px "Barlow Condensed",sans-serif';x.fillText(sub,128,84)}
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true,toneMapped:false}));s.scale.set(1.3,0.57,1);s.renderOrder=10;return s;

function isleMesh(z){
  const geo=new THREE.CylinderGeometry(1.5,1.2,0.35,HI()?48:seg());
  if(!HI())return mesh(geo,ISLE_COL[z],0,0,0);
  const topC=new THREE.Color(ISLE_COL[z]).offsetHSL(0,0.1,-0.07).getHex(),sideC=new THREE.Color(topC).offsetHSL(0,-0.05,-0.22).getHex();
  const top=new THREE.MeshStandardMaterial({color:mode==='clay'?lighten(topC,0.1):0xffffff,map:noiseTex('isle'+z,topC,0.09,256,0.9),roughness:0.95,bumpMap:bumpTex(),bumpScale:0.01,flatShading:mode==='figure'});

// ---------- 动画循环 ----------
const bounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+0.75;if(t<2.5/d)return n*(t-=2.25/d)*t+0.9375;return n*(t-=2.625/d)*t+0.984375};
let prev=performance.now(),frames=0,fpsT=prev,firstFrame=null,lowCount=0;
function loop(now){
  if(failed)return;requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-prev)/1000);prev=now;
  if(focused===null&&now-lastInput>2500){goal.theta+=dt*0.12;cam.theta+=dt*0.12}
  const k=1-Math.pow(0.002,dt);for(const key of ['theta','phi','r','tx','ty','tz'])cam[key]+=(goal[key]-cam[key])*k;
  if(window.__snapCam){for(const key of ['phi','r','tx','ty','tz'])cam[key]=goal[key]}
  placeCam();
  animItems.forEach(ch=>{const u=ch.userData;if(u.drop<1){u.drop=Math.min(1,u.drop+dt*1.4);ch.position.y=(u.baseY||0)+3.2*(1-bounce(u.drop));if(u.drop>=1)u.land=now}
    if(u.land){const q=(now-u.land)/360,b=u.sc||1;if(q<1){const e=Math.sin(q*Math.PI)*(1-q);ch.scale.set(b*(1+0.1*e),b*(1-0.2*e),b*(1+0.1*e))}else{ch.scale.setScalar(b);u.land=0}}
    ch.traverse(o=>{const u=o.userData;if(!u)return;if(u.bob)o.position.y=1.5+Math.sin(now/600)*0.12;if(u.orbit){const t=now/4200;o.position.set(Math.cos(t)*0.75,1.35+Math.sin(now/700)*0.06,Math.sin(t)*0.75);o.rotation.set(0,-t-Math.PI/2,0);o.rotateX(-0.25)}})});
  if(detail&&curSpace==='world')ZONES.forEach(z=>{if(z.group)z.group.position.y=Math.sin(now/1500+z.angle)*0.06});
  animClouds.forEach(c=>{c.position.x+=c.userData.drift*dt;if(c.position.x>24)c.position.x=-24});
  walkers.forEach(w=>w.update(dt,now));if(flowTex)flowTex.offset.y-=dt*0.35;
  if(studyAv){const L=!!studyAv.lounge&&nav==='home.study.lounge';studyAv.desk.visible=!L;if(studyAv.lounge){studyAv.lounge.visible=L;studyAv.pad.visible=!L}avatarG=L?studyAv.lounge:studyAv.desk}
  if(avatarG&&curSpace==='world'&&avatarG.userData.anim&&avatarG.userData.anim.pose==='relax'&&!window.__noTurn){let d=cam.theta+0.5-avatarG.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));avatarG.rotation.y+=d*Math.min(1,dt*2.2)}
  if(avatarG&&avatarG.userData.anim)animAvatar(avatarG.userData.anim,now);
  // 阴影图：three r128 默认在每次 renderer.render 时都重画（极致档一帧要画 3 次）。
  // 改为每帧最多画一次；低阶梯隔帧更新，物品掉落时每帧更新。
  if(renderer.shadowMap.enabled){const ev=curQ==='max'?LV().every:1;
    renderer.shadowMap.needsUpdate=perf.forceShadow||(++perf.frame%ev===0)||animItems.some(ch=>ch.userData.drop<1||ch.userData.land);perf.forceShadow=false}
  if(composer&&curQ==='max'){setFocus();gradeP.uniforms.time.value=now/1000;composer.render()}else renderer.render(scene,camera);
  updateLabels();updateHotspots();
  if(firstFrame===null)firstFrame=Math.round(now);
  frames++;if(now-fpsT>1000){const fps=Math.round(frames*1000/(now-fpsT));frames=0;fpsT=now;
    badge.textContent=`${fps} fps · L${lvl} · ${renderer.getPixelRatio().toFixed(2)}x · ${gpu.short||'GPU 未知'}`;
    perfTick(fps,now);
    if(now>4000&&fps<20&&window.__allowDegrade&&(curQ!=='max'||lvl===LADDER.length-1)){if(++lowCount>=3){if(curQ==='max'){setQuality('fine');toast('帧率不足，已关闭后期效果')}else if(HI()){setQuality('lo');toast('帧率不足，已切回原型画质')}else fallback('帧率过低，已切换为卡片视图')}}else lowCount=0}
}

  if(pw&&w>pw){camera.aspect=(w+pw)/(h+vy);camera.setViewOffset(w+pw,h+vy,pw,0,w,h)}else{camera.clearViewOffset();camera.aspect=w/h}camera.updateProjectionMatrix();

    const tw=x.measureText(n).width;x.font=`${Math.round(28*f)}px "PingFang SC",sans-serif`;x.fillText(u,cx*f+tw+6*f,940*f)});

// ---------- 启动 ----------
function init(){

  // 极致档最后一道是 SMAA，默认帧缓冲的 MSAA 用不上；海报是渲染后同步读取，不需要 preserveDrawingBuffer。
  // powerPreference 只是提示：Mac 双显卡会切独显，Windows 上 Chrome 多半不理会（靠下面的提示引导）。
  try{renderer=new THREE.WebGLRenderer({antialias:!postReady(),alpha:true,powerPreference:'high-performance'})}catch(e){return fallback('设备不支持 WebGL，已切换为卡片视图')}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));stage.prepend(renderer.domElement);
  renderer.shadowMap.autoUpdate=false;
  gpu=detectGPU();lvl=startLevel();
  window.__dreamPerf={get gpu(){return gpu},get level(){return lvl},get fps(){return perf.lastFps},get pixelRatio(){return renderer&&renderer.getPixelRatio()},setLevel};
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(38,1,0.5,90);
  hemi=new THREE.HemisphereLight(0xffffff,0x8a8f96,0.85);scene.add(hemi);
  sun=new THREE.DirectionalLight(0xfff2e2,0.75);sun.position.set(6,10,5);
  sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:30});sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.02;scene.add(sun);
  fill=new THREE.DirectionalLight(0xcfe0ff,0);fill.position.set(-6,4,-5);scene.add(fill);
  addOverlay();ensureLabels();stage.appendChild(hotBox);stage.appendChild(tip);stage.appendChild(fadeEl);stage.appendChild(crumbs);
  curQ='max';quality='hi';detail=true;goal.r=DESK()?16.5:13;goal.phi=DESK()?60*D2R:goal.phi;applyQuality();setLevel(lvl);perf.t0=performance.now();bindInput(renderer.domElement);
  // 切走标签页时 rAF 停了，切回来那一段采样会把帧率算得很低，重新计时
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){fpsT=prev=performance.now();frames=0;perf.settle=Math.max(perf.settle,fpsT+1000)}});

}
