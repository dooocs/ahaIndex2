<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梦想人生 · 3D 场景</title>
<meta name="robots" content="noindex">
<style>
  @font-face { font-family: "ZCOOL KuaiLe"; src: url("/dream/fonts/zcool-kuaile-planet.woff2") format("woff2"); font-display: swap; }
  /* Layout: the planet fills the window; a quiet HUD floats over it —
     name top-left, technique switches top-right, the six zones along the bottom. */
  :root {
    --sky: #8fd3d4;
    --ink: #23303a;
    --ink-soft: #55636c;
    --card: rgba(250, 252, 248, 0.88);
    --line: rgba(35, 48, 58, 0.14);
    --accent: #1f6f78;
    --sun: #e2a93b;
    --display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --body: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--sky); color: var(--ink); font-family: var(--body); }
  #stage { position: fixed; inset: 0; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #c.dragging { cursor: grabbing; }

  .brand {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px) + var(--inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    display: grid; gap: 2px; pointer-events: none;
  }
  .brand h1 { margin: 0; font: 400 26px/1.1 var(--display); letter-spacing: 0.04em; color: var(--ink); }
  .brand p { margin: 0; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.06em; }

  .panel {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px) + var(--inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    width: 220px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 13px;
  }
  .panel summary {
    list-style: none; cursor: pointer; padding: 10px 12px;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; letter-spacing: 0.04em;
  }
  .panel summary::-webkit-details-marker { display: none; }
  .panel summary::after { content: "收起"; font-weight: 400; font-size: 12px; color: var(--ink-soft); }
  .panel:not([open]) summary::after { content: "展开"; }
  .panel .body { display: grid; gap: 2px; padding: 0 12px 12px; }
  .sw { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
  .sw small { display: block; color: var(--ink-soft); font-size: 11px; }
  .sw input { appearance: none; width: 32px; height: 18px; border-radius: 9px; background: #c9d2d4; position: relative; cursor: pointer; transition: background .15s; }
  .sw input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw input:checked { background: var(--accent); }
  .sw input:checked::after { transform: translateX(14px); }
  .sw input:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
  .stats { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font: 11px/1.6 var(--mono); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .reset { margin-top: 6px; font: inherit; font-size: 12px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .reset:focus-visible { outline: 2px solid var(--sun); }

  .zones {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    max-width: calc(100% - 32px);
    padding: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .zones button {
    font: 400 16px/1 var(--display); letter-spacing: 0.08em;
    padding: 9px 14px; border-radius: 8px; border: 0; background: transparent; color: var(--ink); cursor: pointer;
  }
  .zones button:hover { background: rgba(31, 111, 120, 0.1); }
  .zones button[aria-pressed="true"] { background: var(--ink); color: #f4f7f2; }
  .zones button:focus-visible { outline: 2px solid var(--sun); outline-offset: 1px; }

  .hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--ink); opacity: 0.7; white-space: nowrap; pointer-events: none; }

  #labels { position: fixed; inset: 0; pointer-events: none; }
  .tag {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%);
    font: 400 15px/1 var(--display); letter-spacing: 0.1em; color: var(--ink);
    background: #fbfcf7; border: 2px solid var(--ink); border-radius: 6px; padding: 5px 8px 4px;
    pointer-events: auto; cursor: pointer; white-space: nowrap; transition: opacity .2s;
  }
  .tag.mini { font-size: 12px; letter-spacing: 0.06em; padding: 3px 6px 2px; border-width: 1.5px; background: rgba(251, 252, 247, 0.92); }
  .tag::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 2px; height: 6px; background: var(--ink); transform: translateX(-50%); }

  .planets {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(14px + env(safe-area-inset-top, 0px) + var(--inset-top, 0px));
    display: flex; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .planets button { font: 400 14px/1 var(--display); letter-spacing: 0.08em; padding: 7px 12px; border: 0; border-radius: 7px; background: transparent; color: var(--ink); cursor: pointer; }
  .planets button:hover { background: rgba(31, 111, 120, 0.1); }
  .planets button[aria-pressed="true"] { background: var(--accent); color: #f4f7f2; }
  .planets button:focus-visible { outline: 2px solid var(--sun); outline-offset: 1px; }
  #peer-tags { position: fixed; inset: 0; pointer-events: none; }
  .tag.peer { font: 500 11px/1 var(--body); letter-spacing: 0.04em; padding: 3px 5px 3px; border-width: 1.5px; background: rgba(251, 252, 247, 0.9); cursor: pointer; }
  .tag.peer:hover { background: #fff; }
  .bubble {
    position: absolute; left: 0; top: 0; max-width: 220px; padding: 6px 10px; pointer-events: none;
    font: 13px/1.4 var(--body); color: var(--ink); background: #fff; border: 2px solid var(--ink); border-radius: 12px;
    white-space: normal; word-break: break-word; transition: opacity .2s;
  }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 10px; height: 10px; background: #fff; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
  .bubble.mine { background: #fff7e0; }
  .bubble.mine::after { background: #fff7e0; }
  .say {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100vw - 32px));
    display: grid; gap: 8px; padding: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 14px/1.3 var(--body); color: var(--ink);
  }
  .say[hidden] { display: none; }
  .say-head { display: flex; align-items: center; justify-content: space-between; font: 400 15px/1 var(--display); letter-spacing: 0.06em; }
  .say-head button { border: 0; background: transparent; font-size: 18px; line-height: 1; cursor: pointer; color: var(--ink-soft); padding: 2px 6px; }
  .say-quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .say-quick button { font: 13px/1 var(--body); padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer; }
  .say-quick button:hover { border-color: var(--accent); }
  .say-row { display: flex; gap: 6px; }
  .say-row input { flex: 1; min-width: 0; font: 14px/1 var(--body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  .say-row input:focus-visible { outline: 2px solid var(--sun); outline-offset: 0; }
  .say-row button { font: 14px/1 var(--body); padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #f4f7f2; cursor: pointer; }
  .say.nope { animation: nope .3s; }
  @keyframes nope { 25% { transform: translateX(calc(-50% - 6px)); } 75% { transform: translateX(calc(-50% + 6px)); } }
  .inbox { position: fixed; right: 14px; top: calc(104px + env(safe-area-inset-top, 0px) + var(--inset-top, 0px)); width: 260px; display: flex; flex-direction: column; gap: 6px; }
  .note { padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; font: 13px/1.45 var(--body); color: var(--ink); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .note p { margin: 0 0 6px; word-break: break-word; }
  .note div { display: flex; justify-content: flex-end; gap: 6px; }
  .note button { font: 12px/1 var(--body); padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; }
  .note button[data-a="reply"] { background: var(--accent); border-color: var(--accent); color: #f4f7f2; }
  .tag.peer.idle { color: var(--ink-soft, #6b7378); border-style: dashed; }
  .company {
    position: fixed; right: 14px; top: calc(14px + env(safe-area-inset-top, 0px) + var(--inset-top, 0px));
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font: 400 14px/1 var(--display); color: var(--ink);
  }
  .online, .who { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .online[hidden] { display: none; }
  .online .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb36b; box-shadow: 0 0 0 3px rgba(63, 179, 107, 0.2); }
  .online small { font-size: 12px; opacity: 0.7; }
  .who { padding: 4px 4px 4px 10px; gap: 4px; }
  .who span { font-size: 12px; opacity: 0.7; margin-right: 2px; }
  .who button { font: inherit; letter-spacing: 0.06em; padding: 6px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ink); cursor: pointer; }
  .who button:hover { background: rgba(31, 111, 120, 0.1); }
  .who button[aria-pressed="true"] { background: var(--accent); color: #f4f7f2; }
  .who button:focus-visible { outline: 2px solid var(--sun); outline-offset: 1px; }
  .veil {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    background: var(--sky); color: var(--ink); font: 400 22px/1 var(--display); letter-spacing: 0.12em;
    opacity: 0; transition: opacity .6s ease;
  }
  .veil.on { opacity: 1; }
  html:not(.debug) .brand, html:not(.debug) .panel, html:not(.debug) .hint { display: none; }
  .err { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)); text-align: center; color: var(--ink); }

  @media (max-width: 640px) {
    .panel { width: 190px; }
    .hint { display: none; }
    .zones button { padding: 8px 10px; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) { .veil, .tag, .sw input, .sw input::after { transition: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="梦想星球 3D 场景"></canvas></div>
<div id="labels" aria-hidden="true"></div>
<div id="peer-tags" aria-hidden="true"></div>

<header class="brand">
  <h1>梦想星球</h1>
  <p>小星球原型 v0.3</p>
</header>

<details class="panel" id="panel" open>
  <summary>技法开关</summary>
  <div class="body">
    <label class="sw"><span>色阶明暗<small>两阶亮暗，关掉是普通渐变</small></span><input type="checkbox" id="t-toon" checked></label>
    <label class="sw"><span>碎边交界<small>噪声扰动明暗与阴影边</small></span><input type="checkbox" id="t-break" checked></label>
    <label class="sw"><span>整团受光<small>树冠法线从中心向外</small></span><input type="checkbox" id="t-blob" checked></label>
    <label class="sw"><span>描边<small>深度 + 法线边缘检测</small></span><input type="checkbox" id="t-line" checked></label>
    <label class="sw"><span>手绘天空<small>平涂云块</small></span><input type="checkbox" id="t-sky" checked></label>
    <label class="sw"><span>纸纹颗粒</span><input type="checkbox" id="t-grain" checked></label>
    <label class="sw"><span>区域标签</span><input type="checkbox" id="t-tags" checked></label>
    <button class="reset" id="t-plain" type="button">一键对比：全部关闭</button>
    <div class="stats" id="stats">—</div>
  </div>
</details>

<nav class="planets" id="planets" aria-label="星球"></nav>
<form class="say" id="say" hidden autocomplete="off">
  <div class="say-head"><span id="say-to">说点什么</span><button type="button" id="say-close" aria-label="关闭">×</button></div>
  <div class="say-quick" id="say-quick"></div>
  <div class="say-row"><input id="say-text" maxlength="60" placeholder="说点什么…（回车发送）" enterkeyhint="send"><button type="submit">发送</button></div>
</form>
<div class="inbox" id="inbox" aria-live="polite"></div>
<aside class="company" aria-label="在线">
  <div class="online" id="online" hidden><span class="dot"></span><span id="online-count">1 人在线</span><small id="online-sub"></small></div>
  <div class="who" id="who" role="group" aria-label="我的形象"><span>我是</span><button type="button" data-kind="m">男生</button><button type="button" data-kind="f">女生</button><button type="button" id="reroll" title="随机换一套发型和衣服" aria-label="换一套">换一套</button></div>
</aside>
<div class="veil on" id="veil">正在生成星球…</div>

<p class="hint">拖动转动星球 · WASD / 方向键行走 · 点击区域前往</p>
<nav class="zones" id="zones" aria-label="区域"></nav>

<script>if (/[?&]debug\b/.test(location.search)) document.documentElement.classList.add('debug');</script>
<script type="importmap">

  "three": "/dream/vendor/three-r170/three.module.min.js",

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
// Where the avatar can stand and how it moves: plain JS, no three.js, unit-tested in tests/dream-walk.test.mjs
import { createWalkField, createController, findPath, shapes } from './js/walk/index.js';
// Who else is here: presence (transport-agnostic), a BroadcastChannel stand-in for ?presence=local, IP → province
import { createPresence, activityOf } from './js/net/presence.js';
import { createLocalConnect } from './js/net/local.js';
import { lookupProvince } from './js/net/province.js';

// Authored hex colours are used as-is in every shader (no sRGB conversion), so the
// palette on screen is exactly the palette written here.
THREE.ColorManagement.enabled = false;

// planet radius (set by each planet's builder); the avatar is ~1.15 tall, 1 unit ≈ 1.5 m.
// AW rescales path widths and spacings, which were tuned at R = 26.
let R = 50, AW = 26 / R, WATER = -0.55;
const SUN = new THREE.Vector3(-0.75, 1.1, 0.12).normalize();
const canvas = document.getElementById('c');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div class="err"><p>这台设备的浏览器没有开启 WebGL，无法显示 3D 场景。</p></div>');
  throw e;
}
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.info.autoReset = false;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 160);
const camBase = { y: 3.4, z: 6.6 };
let camZoom = 1.35, camLift = 0;      // camLift: the avatar's ground height, smoothed
function placeCamera() {
  camera.position.set(0, R + camLift + camBase.y * camZoom, camBase.z * camZoom);
  camera.lookAt(0, R + camLift + 0.4 + (camZoom - 1) * 1.1, -7 - (camZoom - 1) * 3);
}
placeCamera();
camera.layers.enable(1);

const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 160 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
sun.shadow.radius = 3;
scene.add(sun, sun.target);

let planet = new THREE.Group();

// ---------- noise (JS side: terrain height, scatter) ----------
function h3(x, y, z) {
  let px = (x * 0.3183099 + 0.1) % 1, py = (y * 0.3183099 + 0.1) % 1, pz = (z * 0.3183099 + 0.1) % 1;
  if (px < 0) px += 1; if (py < 0) py += 1; if (pz < 0) pz += 1;
  px *= 17; py *= 17; pz *= 17;
  const v = px * py * pz * (px + py + pz);
  return v - Math.floor(v);
}
function vnoise(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  let fx = x - ix, fy = y - iy, fz = z - iz;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const l = (a, b, t) => a + (b - a) * t;
  return l(
    l(l(h3(ix, iy, iz), h3(ix + 1, iy, iz), fx), l(h3(ix, iy + 1, iz), h3(ix + 1, iy + 1, iz), fx), fy),
    l(l(h3(ix, iy, iz + 1), h3(ix + 1, iy, iz + 1), fx), l(h3(ix, iy + 1, iz + 1), h3(ix + 1, iy + 1, iz + 1), fx), fy), fz);
}
const fbm3 = (x, y, z) => 0.55 * vnoise(x, y, z) + 0.3 * vnoise(x * 2.13 + 3.1, y * 2.13 + 3.1, z * 2.13 + 3.1) + 0.15 * vnoise(x * 4.37 + 7.7, y * 4.37 + 7.7, z * 4.37 + 7.7);
let seed = 7;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
// A planet is built in slices: slice() hands the thread back once ~40 ms have passed, so clicks
// (here and in the site header around this page) and the veil keep working during a build.
const yieldNow = () => new Promise(r => { const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0); });
let sliceT = 0;
async function slice() { if (performance.now() - sliceT > 40) { await yieldNow(); sliceT = performance.now(); } }

const D2R = Math.PI / 180;
const sph = (lat, lon) => new THREE.Vector3(
  Math.cos(lat * D2R) * Math.sin(lon * D2R), Math.sin(lat * D2R), -Math.cos(lat * D2R) * Math.cos(lon * D2R)).normalize();
const L = (s, x, z) => s.dir.clone().multiplyScalar(R).addScaledVector(s.ex, x).addScaledVector(s.ez, z).normalize();
const LT = (s, dx, dz) => s.ex.clone().multiplyScalar(dx).addScaledVector(s.ez, dz);
function local(s, d) {
  const c = d.dot(s.dir);
  if (c < 0.72) return null;
  const k = R / c;
  return { x: d.dot(s.ex) * k, z: d.dot(s.ez) * k };
}

const clamp01 = v => Math.max(0, Math.min(1, v));
const sstep = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
function segT(p, a, b) {
  const abx = b[0] - a[0], abz = b[1] - a[1];
  return clamp01(((p.x - a[0]) * abx + (p.z - a[1]) * abz) / (abx * abx + abz * abz));
}
function segD(p, a, b) {
  const t = segT(p, a, b);
  return Math.hypot(p.x - a[0] - (b[0] - a[0]) * t, p.z - a[1] - (b[1] - a[1]) * t);
}
const polyD = (p, pts) => { let m = Infinity; for (let i = 0; i < pts.length - 1; i++) m = Math.min(m, segD(p, pts[i], pts[i + 1])); return m; };
const inRect = (p, x0, x1, z0, z1) => !!p && p.x > x0 && p.x < x1 && p.z > z0 && p.z < z1;
const rectFall = (p, x0, x1, z0, z1, f) => clamp01(1 - Math.hypot(Math.max(x0 - p.x, 0, p.x - x1), Math.max(z0 - p.z, 0, p.z - z1)) / f);
const bump = (p, c, r, h) => h * Math.exp(-((p.x - c[0]) ** 2 + (p.z - c[1]) ** 2) / (r * r));
const arcsIn = (s, pts, hw, list) => { for (let i = 0; i < pts.length - 1; i++) list.push([L(s, ...pts[i]), L(s, ...pts[i + 1]), hw]); };
function arcDist(d, a, b) {
  const n = new THREE.Vector3().crossVectors(a, b).normalize();
  const off = d.dot(n);
  const p = d.clone().addScaledVector(n, -off).normalize();
  const ab = a.angleTo(b);
  if (Math.abs(a.angleTo(p) + p.angleTo(b) - ab) < 1e-3) return Math.asin(Math.min(1, Math.abs(off)));
  return Math.min(d.angleTo(a), d.angleTo(b));
}
// Each arc only reaches hw·AW·2 radians, but the ground asks about ~260k vertices. So a list is
// compiled once (again whenever arcs are pushed) with two cheap lower bounds on the distance —

    const crown = canopy([[0, 1.0, 0, 0.48], [0.3, 0.86, 0.1, 0.34], [-0.28, 0.9, -0.1, 0.35]], 61);

    const pc = new THREE.InstancedMesh(crown, toon(0xf4b4c4, { kind: 'FOLIAGE', shade: 0xc3809a, breakMul: 0.6, noiseScale: 1.8 }), peachM.length);
    peachM.forEach((m, i) => { pt.setMatrixAt(i, m); pc.setMatrixAt(i, m); });
    [pt, pc].forEach(o => { o.castShadow = o.receiveShadow = true; addObj(o); });
  }
  {
    const spots = [[3.7, -2.9], [-7.6, 1.6], [7.2, -1.9]];
    const ms = spots.map(([x, z]) => matrixOn(L(XIXI, x, z), rand() * 6.28, 1.0, 0.03));
    const trunk = new THREE.CylinderGeometry(0.07, 0.1, 1.0, 7); trunk.translate(0, 0.5, 0);
    const crown = canopy([[0, 1.35, 0, 0.62], [0.4, 1.12, 0.1, 0.44], [-0.38, 1.16, -0.1, 0.45]], 71);
    const tt = new THREE.InstancedMesh(trunk, toon(0x6e5446, { shade: 0x4f4448 }), ms.length);
    const cc = new THREE.InstancedMesh(crown, toon(0x6f9a4a, { kind: 'FOLIAGE', shade: 0x3e6a4e, breakMul: 0.7, noiseScale: 1.6 }), ms.length);
    ms.forEach((m, i) => { tt.setMatrixAt(i, m); cc.setMatrixAt(i, m); });
    const fruitG = new THREE.SphereGeometry(0.075, 8, 6), fruitM = [];
    ms.forEach(m => {
      for (let j = 0; j < 16; j++) {
        const a = rand() * Math.PI * 2, el = 0.1 + rand() * 1.1, rr = 0.66;
        fruitM.push(m.clone().multiply(new THREE.Matrix4().makeTranslation(Math.cos(a) * Math.cos(el) * rr, 1.25 + Math.sin(el) * rr * 0.7, Math.sin(a) * Math.cos(el) * rr)));
      }
    });
    const fr = new THREE.InstancedMesh(fruitG, toon(0xf28a2e, { shade: 0xc2602e, breakMul: 0 }), fruitM.length);
    fruitM.forEach((m, i) => fr.setMatrixAt(i, m));
    [tt, cc, fr].forEach(o => { o.castShadow = o.receiveShadow = true; addObj(o); });
  }

  await slice();
  // bushes: meadow edges plus a hedge inside the courtyard railing
  {
    const bg = canopy([[0, 0.32, 0, 0.42], [0.36, 0.24, 0.1, 0.3], [-0.32, 0.26, -0.08, 0.32]], 41);
    const bm = scatterDirs(Math.round(105 * AREA * TREE_SHARE), 0.035, 0.3, 0.35, 40000, null, treeFill).map(d => matrixOn(d, rand() * 6.28, 0.7 + rand() * 0.6, 0.08));
    const { x0, x1, z0, z1 } = HOME_FENCE;
    for (let x = x0 + 0.6; x <= x1 - 0.6; x += 0.95) { if (Math.abs(x) > HOME_GATE + 1.2) bm.push(matrixOn(L(HOME, x, z1 - 0.55), rand() * 6.28, 0.75, 0.08)); bm.push(matrixOn(L(HOME, x, z0 + 0.55), rand() * 6.28, 0.75, 0.08)); }
    for (let z = z0 + 1.4; z <= z1 - 0.9; z += 0.95) [x0 + 0.55, x1 - 0.55].forEach(x => bm.push(matrixOn(L(HOME, x, z), rand() * 6.28, 0.75, 0.08)));
    const bushes = new THREE.InstancedMesh(bg, toon(0x6aae5c, { kind: 'FOLIAGE', shade: 0x336f5c, breakMul: 0.75, noiseScale: 1.6 }), bm.length);
    const bc = new THREE.Color();
    bm.forEach((m, i) => { bushes.setMatrixAt(i, m); bushes.setColorAt(i, bc.setHex(leafTints[(i + 1) % leafTints.length])); });
    bushes.castShadow = bushes.receiveShadow = true;
    addObj(bushes);
  }

  await slice();
  const rockDirs = scatterDirs(Math.round(56 * AREA * TREE_SHARE), 0.04, 0.3, 0.15, 30000, null, treeFill);
  const rg = lump(0.5, 1, 0.35, 2.3); rg.scale(1, 0.62, 1);
  const rocks = new THREE.InstancedMesh(rg, toon(0xd8ceb6, { kind: 'ROCK', shade: 0x8f93a0, breakMul: 0.5, noiseScale: 1.6 }), rockDirs.length);
  rockDirs.forEach((d, i) => rocks.setMatrixAt(i, matrixOn(d, rand() * 6.28, 0.4 + rand() * 1.1, 0.12)));
  rocks.castShadow = rocks.receiveShadow = true;
  addObj(rocks);

  await slice();
  // reeds in the shallows of the wetland and the lake
  {
    const parts = [];
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2, h = 0.7 + (i % 3) * 0.16, g = new THREE.ConeGeometry(0.022, h, 3);
      g.translate(0, h / 2, 0); g.rotateZ(Math.cos(a) * 0.18); g.rotateX(Math.sin(a) * 0.18); g.translate(Math.cos(a) * 0.08, 0, Math.sin(a) * 0.08);
      parts.push(prep(g));
      if (i % 2 === 0) { const t = new THREE.SphereGeometry(0.045, 5, 4); t.scale(1, 2.6, 1); t.translate(Math.cos(a) * 0.08 + Math.cos(a) * 0.18 * h * 0.0, h + 0.05, Math.sin(a) * 0.08); parts.push(prep(t)); }
    }
    const reed = mergeGeometries(parts);
    const rn = reed.attributes.normal; for (let i = 0; i < rn.count; i++) rn.setXYZ(i, 0, 1, 0);
    const shallow = (s, p) => { const h = terrainH(L(s, p.x, p.z)); return h > WATER - 0.38 && h < WATER + 0.18; };
    const rd = [
      ...scatterIn(XIXI, 420, -9.5, 9.5, -9.5, 5.5, p => shallow(XIXI, p) && polyD(p, BOARDWALK) > 0.7 && Math.abs(p.x - 3.4) > 0.8 && Math.abs(p.x - 0.3) > 1.2, 0, true),
      ...scatterIn(LAKE, 160, -10, 10, -8, 3.0, p => shallow(LAKE, p) && Math.abs(p.x - 6.75) > 0.9, 0, true),
    ];
    const reeds = new THREE.InstancedMesh(reed, toon(0xcdc47e, { shade: 0x8f9a72, breakMul: 0.4 }), rd.length);
    const c = new THREE.Color(), tints = [0xffffff, 0xe9f0d8, 0xf4ead2];
    rd.forEach((d, i) => { reeds.setMatrixAt(i, matrixOn(d, rand() * 6.28, 0.8 + rand() * 0.5)); reeds.setColorAt(i, c.setHex(tints[i % 3])); });
    reeds.receiveShadow = true; reeds.layers.set(1);
    addObj(reeds);
  }

  await slice();
  // grass tufts and flowers: colour pass only (layer 1) so they add texture without line noise
  const blade = (x, z, h, lean) => { const g = new THREE.ConeGeometry(0.05, h, 3, 1); g.translate(0, h / 2, 0); g.rotateZ(lean); g.translate(x, 0, z); return prep(g); };
  const tuft = mergeGeometries([blade(0, 0, 0.34, 0.1), blade(0.07, 0.03, 0.26, -0.35), blade(-0.06, 0.04, 0.24, 0.4), blade(0.01, -0.07, 0.22, -0.15)]);
  const tn = tuft.attributes.normal; for (let i = 0; i < tn.count; i++) tn.setXYZ(i, 0, 1, 0);
  const grassDirs = scatterDirs(Math.round(2700 * AREA * GRASS_SHARE), 0, 0, 0.4, 160000, d => !walk.inFootprint(d, 0.15), grassFill);
  const grass = new THREE.InstancedMesh(tuft, toon(0x7cb85e, { shade: 0x4a8468, breakMul: 0.5 }), grassDirs.length);
  grassDirs.forEach((d, i) => grass.setMatrixAt(i, matrixOn(d, rand() * 6.28, 0.7 + rand() * 0.8)));
  grass.receiveShadow = true; grass.layers.set(1);
  addObj(grass);

  await slice();
  const fg = new THREE.IcosahedronGeometry(0.07, 0); fg.translate(0, 0.16, 0);
  const flowerDirs = scatterDirs(Math.round(310 * AREA * GRASS_SHARE), 0, 0, 0.3, 40000, d => !walk.inFootprint(d, 0.15), grassFill);
  const flowers = new THREE.InstancedMesh(fg, toon(0xffffff, { shade: 0xb9b6c8, breakMul: 0 }), flowerDirs.length);
  const fc = [0xfaf6ee, 0xf3d35c, 0xe98a7a, 0xb9a3e3];
  const c = new THREE.Color();
  flowerDirs.forEach((d, i) => { flowers.setMatrixAt(i, matrixOn(d, 0, 0.8 + rand() * 0.6)); flowers.setColorAt(i, c.setHex(fc[i % fc.length])); });
  flowers.receiveShadow = true; flowers.layers.set(1);
  addObj(flowers);
}

W.update = t => updateBoats(t);
W.lawnEx = HOME.ex.clone();
W.startLon = -12;
}

// ======================= 滑雪星球: 北海道 + 羊蹄山 + 崇礼 + 雪如意 =======================
async function buildSki() {
  R = 40; AW = 26 / R; WATER = -6;            // no open water on this planet
  beginWalk();
  const HW = u => u / 23.9;                    // half-width in units → the width unit arcsIn expects
  sites = makeSites([
    { key: 'hokkaido', roadZ: 6.2, side: 1, lon: 0 },
    { key: 'yotei', roadZ: 13, side: -1, lon: 9 },
    { key: 'chongli', roadZ: 6.2, side: 1, lon: 150 },
    { key: 'ruyi', roadZ: 6.0, side: -1, lon: 205 },
  ]);
  const [HOK, YOT, CHO, RUY] = sites;
  sites.forEach((s, i) => ROADS.push([s.node, sites[(i + 1) % sites.length].node, HW(1.25)]));

  // ---------- plan ----------
  const ONSEN = [-6.4, 2.4];
  const HOK_RUNS = [
    [[[0.6, -21], [1.8, -15], [0.2, -9], [1.0, -4], [0.5, -1.2]], 1.5],
    [[[-3.5, -19], [-6.0, -13], [-4.6, -7], [-2.6, -2.6], [-1.6, -1.2]], 1.35],
    [[[5.2, -19], [7.4, -12], [6.4, -6], [4.6, -2.4]], 1.35],
  ];
  const CHO_RUNS = [
    [[[0, -24], [-1.5, -17], [0.5, -11], [-0.8, -5], [0, -1.2]], 1.35],
    [[[-7.5, -20], [-9, -13], [-7, -7], [-5.2, -2.4], [-2.6, -1.2]], 1.25],
    [[[8, -21], [9.6, -14], [7.6, -8], [5.2, -3], [3, -1.2]], 1.25],
    [[[3.4, -18], [4.4, -12], [3.4, -7], [2.4, -2.6]], 1.0],
  ];
  const LIFTS = [
    { s: HOK, x: 3.3, z0: 0.6, z1: -20.5, kind: 'chair' },
    { s: CHO, x: -3.7, z0: 0.6, z1: -22.5, kind: 'gondola' },
  ];
  const RING = { z: -16.8, ro: 3.0, ri: 1.6, lift: 4.3 };      // 雪如意 top club
  const INRUN = { z0: RING.z + RING.ro, z1: -8.0 };
  HOK_RUNS.forEach(([pts, hw]) => arcsIn(HOK, pts, HW(hw), STONES));
  CHO_RUNS.forEach(([pts, hw]) => arcsIn(CHO, pts, HW(hw), STONES));
  STONE_RECTS.push([HOK, -10, 10, -1.6, HOK.roadZ - 0.8], [CHO, -10, 10, -1.6, CHO.roadZ - 0.8]);
  STONE_RECTS.push([RUY, -1.7, 1.7, INRUN.z1 - 0.4, 0], [RUY, -3.0, 3.0, -0.4, RUY.roadZ - 0.8]);
  arcsIn(YOT, [[0, YOT.roadZ], [0, 10.6]], HW(0.7), STONES);

  await slice();
  // ---------- terrain ----------
  const hillsBase = d => { const f = 2.6 / AW, g = 7.5 / AW; return 0.75 * fbm3(d.x * f + 5, d.y * f, d.z * f) + 0.25 * fbm3(d.x * g, d.y * g + 2, d.z * g); };
  const g2 = (p, cx, cz, rx, rz, h) => h * Math.exp(-(((p.x - cx) / rx) ** 2 + ((p.z - cz) / rz) ** 2));
  const hokMtn = p => g2(p, 0, -20, 10.5, 10, 7.5) + g2(p, 0, -12, 15, 9, 2.6);
  const choMtn = p => g2(p, 0, -19, 8.5, 9, 9) + g2(p, -8, -15, 5, 8, 3.2) + g2(p, 8.5, -16, 5, 8, 3.2) + g2(p, 0, -9, 14, 7, 1.8);
  const yoteiH = p => { const r = Math.hypot(p.x, p.z), t = clamp01(1 - r / 10.5); return 12 * Math.pow(t, 1.55) - 1.1 * Math.exp(-r * r / 1.1) * (t > 0.85 ? 1 : 0); };
  const ruyiH = p => 8.5 * (1 - sstep(-11.5, 0.5, p.z)) * sstep(-26, -17, p.z) * Math.exp(-(Math.max(0, Math.abs(p.x) - 2.4) ** 2) / 14);
  terrainH = function (d) {
    let flat = Math.min(1, roadW(d) * 1.6), p, add = 0;
    if ((p = local(HOK, d))) { const v = rectFall(p, -10.5, 10.5, -2.2, HOK.roadZ, 3); flat = Math.max(flat, v); add += hokMtn(p) * (1 - v); }
    if ((p = local(CHO, d))) { const v = rectFall(p, -10.5, 10.5, -2.2, CHO.roadZ, 3); flat = Math.max(flat, v); add += choMtn(p) * (1 - v); }
    if ((p = local(RUY, d))) { const v = rectFall(p, -6.5, 6.5, 0.4, RUY.roadZ, 2.5); flat = Math.max(flat, v); add += ruyiH(p) * (1 - v); }
    if ((p = local(YOT, d))) add += yoteiH(p) * (1 - flat);
    return (hillsBase(d) - 0.42) * 1.5 * (1 - flat) + 0.05 + add;
  };
  const DIR_YOTEI = YOT.dir.clone();
  // the 粉雪道 stop looks across the valley at 羊蹄山; keep that line of sight free of trees
  const SLOPE_STAND = [-4.7, -7.6], YOT_IN_HOK = local(HOK, YOT.dir);
  const yoteiView = p => { const ax = SLOPE_STAND[0], az = SLOPE_STAND[1], dx = YOT_IN_HOK.x - ax, dz = YOT_IN_HOK.z - az, l = Math.hypot(dx, dz);
    return segD(p, [ax - dx / l * 9, az - dz / l * 9], [YOT_IN_HOK.x, YOT_IN_HOK.z]) < 2.6; };

  await slice();
  // ---------- footprints and stops ----------
  const VILLAGE = {
    hok: [[-3.0, -0.4, 2.4, 1.8, 1.3, 0xa2483c], [-8.4, -0.9, 2.0, 1.6, 1.2, 0x3f5a4e], [-9.3, 3.5, 1.7, 1.4, 1.1, 0x5c3f36]],
    cho: [[-7.4, -0.6, 2.6, 1.8, 1.6, 0x3d4148], [7.0, -0.8, 3.0, 2.0, 2.2, 0x3d4148], [8.9, 2.7, 1.8, 1.6, 1.4, 0x5c3f36]],
  };
  const HOTEL = [7.4, -0.6, 3.4, 2.2, 2.9];

    VILLAGE.hok.forEach(([x, z, w, d]) => box(HOK, x - w / 2 - 0.2, x + w / 2 + 0.2, z - d / 2 - 0.2, z + d / 2 + 0.2));
    VILLAGE.cho.forEach(([x, z, w, d]) => box(CHO, x - w / 2 - 0.2, x + w / 2 + 0.2, z - d / 2 - 0.2, z + d / 2 + 0.2));
    box(HOK, HOTEL[0] - HOTEL[2] / 2 - 0.2, HOTEL[0] + HOTEL[2] / 2 + 0.2, HOTEL[1] - HOTEL[3] / 2 - 0.2, HOTEL[1] + HOTEL[3] / 2 + 0.2);

  zones = [

    { name: '温泉', s: HOK, via: [], stand: [-3.9, 4.5], look: ONSEN, zoom: 1.1, label: ONSEN, h: 1.7 },
    { name: '粉雪道', s: HOK, via: [[-1.4, -0.9], [-2.8, -3.0]], stand: SLOPE_STAND, look: DIR_YOTEI, zoom: 2.0, label: SLOPE_STAND, h: 2.3 },
    { name: '崇礼', s: CHO, via: [], stand: [0.6, 3.6], look: [0, -14], zoom: 2.4, label: [0, -12], h: 7.5 },
    { name: '雪如意', s: RUY, via: [], stand: [0.6, 3.4], look: [0, -13], zoom: 2.7, label: [0, RING.z], h: RING.lift + 2.0 },
  ];
  LANDMARKS = [
    { name: '羊蹄山', s: YOT, at: [0, 0], h: 1.4 },
    { name: '顶峰俱乐部', s: RUY, at: [0, RING.z], h: RING.lift + 1.0 },
  ];

  await buildGround({ detail: 130, lit: 0xf3f7fb, shade: 0xa9bed9, defs: ['SNOW'] });

  await slice();
  // ---------- buildings ----------
  const SNOW = 0xf6f9fc, SNOW_SH = 0xb6c7de, WIN = 0xf6d58e;
  const snowO = { shade: SNOW_SH, breakMul: 0.3 };
  function gable(k, w, d, rise, hex, y, opts) {
    const tri = new THREE.Shape(); tri.moveTo(-d / 2, 0); tri.lineTo(d / 2, 0); tri.lineTo(0, rise); tri.closePath();

  placeMarker(autoWalk.route[autoWalk.route.length - 1], true);

function followRoute(dt) {

  const ang = Math.atan2(toward.dot(rightTmp.crossVectors(pose.f, pose.p)), toward.dot(pose.f));
  const go = Math.max(0, Math.cos(ang)) ** 2;                 // slow down for sharp turns

        e.a.root.quaternion.setFromRotationMatrix(basis);
        poseAvatar(e.a, e.k, e.phase, t, W.ski);
        const label = q.act === 'idle' ? `${q.prov || '未知'} · 挂机` : (q.prov || '未知');
        if (e.tag.textContent !== label) e.tag.textContent = label;
        e.tag.classList.toggle('idle', q.act === 'idle');
      }
    },
    /** per frame, after rendering: put each name tag over its person */
    placeTags() {
      for (const e of shown.values()) {
        tmp.copy(e.p).multiplyScalar(R + walk.surfaceH(e.p) + TAG_UP).applyQuaternion(group.quaternion);
        const vis = tmp.y / tmp.length() > W.tagCos[0];
        tmp.project(camera);
        const sy = (-tmp.y * 0.5 + 0.5) * innerHeight;
        const show = vis && tmp.z < 1 && Math.abs(tmp.x) < 1.05 && sy > insetTop + 36 && sy < innerHeight + 20;
        e.tag.style.opacity = show ? '1' : '0';
        e.tag.style.pointerEvents = show ? 'auto' : 'none';
        if (show) e.tag.style.transform = `translate(${(tmp.x * 0.5 + 0.5) * innerWidth}px, ${sy}px) translate(-50%, -100%)`;
      }
      const now = performance.now();
      for (const [key, b] of bubbles) {
        const e = key === 'me' ? null : shown.get(key);
        if (now > b.until || (key !== 'me' && !e)) { b.el.remove(); bubbles.delete(key); continue; }
        if (key === 'me') tmp.set(0, me.root.position.y + TAG_UP + 0.25, 0);
        else tmp.copy(e.p).multiplyScalar(R + walk.surfaceH(e.p) + TAG_UP + 0.25).applyQuaternion(group.quaternion);
        bubbleAt(b.el, tmp);
      }
    },
  };
})();
if (/[?&]presence=local\b/.test(location.search)) company.useTransport(createLocalConnect());
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'dream:config' || !e.data.realtime) return;
  const { url, key } = e.data.realtime;
  if (url && key) import('./js/net/supabase.js').then(m => company.useTransport(m.createSupabaseConnect({ url, key }))).catch(() => { /* realtime unavailable: no company */ });
});

// ---------- loop ----------
const clock = new THREE.Clock();
const avatarDir = new THREE.Vector3(), invQ = new THREE.Quaternion();
const tagPos = new THREE.Vector3();
let frames = 0, fpsT = 0, fps = 0, slowSecs = 0, runPhase = 0, elapsed = 0;
const statsEl = sw('stats');
// fallback tiers for weak GPUs: 1 = no grass/reeds/flowers/snowfall and a smaller shadow map, 2 = also no ink lines
let lowTier = 0;
function setLowTier(t) {
  lowTier = t;
  if (t >= 1 && sun.shadow.mapSize.x > 1024) { sun.shadow.mapSize.set(1024, 1024); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }
  if (t >= 2) { sw('t-line').checked = false; toggles.line(); }
}

function frame() {
  requestAnimationFrame(frame);
  if (building) { clock.getDelta(); return; }
  const dt = Math.min(0.05, clock.getDelta());
  elapsed += dt;

  // keyboard walking
  const fw = (keys.has('w') || keys.has('arrowup') ? 1 : 0) - (keys.has('s') || keys.has('arrowdown') ? 1 : 0);
  const tr = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
  if (fw || tr) { walkBy(tr * 1.3 * dt, fw * W.walkSpeed / R * dt); setActive(null); }
  let walking = Math.abs(fw);
  turnLean += ((tr ? -tr * 0.35 : 0) - turnLean) * Math.min(1, dt * 6);
  if (autoWalk && !travel) walking = Math.max(walking, followRoute(dt));
  overlay.quaternion.copy(planet.quaternion);
  if (marker.visible) {
    const age = elapsed - marker.userData.t0, done = marker.userData.ok ? !autoWalk : age > 0.6;
    marker.userData.fade = done ? (marker.userData.fade ?? age) : undefined;
    const fadeT = done ? age - marker.userData.fade : 0;
    marker.material.opacity = Math.max(0, 0.9 - fadeT * 2.5);
    marker.scale.setScalar(1 + 0.12 * Math.sin(age * 6));
    if (marker.material.opacity <= 0) marker.visible = false;
  }

  if (travel) {
    const tv = travel;
    tv.t += dt;
    const p1 = easeOut(Math.min(1, tv.t / tv.Tb));
    const pw = Math.min(1, Math.max(0, (tv.t - tv.t0) / tv.Tw));
    const p2 = EASE[tv.ease](pw);
    const p3 = tv.Tt ? EASE.inout(Math.min(1, Math.max(0, (tv.t - tv.t0 - tv.Tw) / tv.Tt))) : 0;
    const q = new THREE.Quaternion().setFromAxisAngle(Y, tv.beta2 * p3)
      .multiply(new THREE.Quaternion().setFromAxisAngle(X, tv.gamma * p2))
      .multiply(new THREE.Quaternion().setFromAxisAngle(Y, tv.beta * p1));
    planet.quaternion.multiplyQuaternions(q, tv.q0);
    post.uniforms.uSkyYaw.value += tv.beta * (p1 - tv.d1) + tv.beta2 * (p3 - tv.d3);
    post.uniforms.uSkyDrift.value += tv.gamma * (p2 - tv.d2);
    const rate = Math.abs(tv.gamma * (p2 - tv.d2)) / dt;
    turnLean += (-Math.sign(tv.beta2) * 0.25 * Math.sin(Math.PI * p3) - turnLean) * Math.min(1, dt * 6);
    tv.d1 = p1; tv.d2 = p2; tv.d3 = p3;
    walking = Math.max(Math.min(1, rate * R / W.walkSpeed), p3 > 0 && p3 < 1 ? 0.35 : 0);
    if (tv.t >= Math.max(tv.Tb, tv.t0 + tv.Tw + tv.Tt)) {
      travel = null;
      if (legs.length) startLeg(legs.shift()); else curStop = arriving;
    }
  }
  moveSpeed += (walking - moveSpeed) * Math.min(1, dt * 8);

  // avatar stands on whatever ground is under the north pole right now
  invQ.copy(planet.quaternion).invert();
  avatarDir.set(0, 1, 0).applyQuaternion(invQ);
  me.root.position.set(0, R + walk.surfaceH(avatarDir), 0);
  camLift += (me.root.position.y - R - camLift) * Math.min(1, dt * 2.5);
  me.root.rotation.y = Math.PI + turnLean;   // modelled facing +z; turn to face away from camera

  runPhase += dt * (4 + moveSpeed * 7);
  poseAvatar(me, moveSpeed, runPhase, elapsed, W.ski);

  // camera pulls back at big places, closer while walking
  const zt = flyZoom ?? (travel || curStop == null ? 1.35 : zones[curStop].zoom) * zoomUser;
  camZoom += (zt - camZoom) * Math.min(1, dt * 1.4);
  placeCamera();
  if (W.update) W.update(elapsed);

  company.update(dt, elapsed);
  planet.updateMatrixWorld();
  G.uPlanetInv.value.copy(planet.matrixWorld).invert();
  G.uTime.value = elapsed;
  post.uniforms.uTime.value = elapsed;
  post.uniforms.uInvProj.value.copy(camera.projectionMatrixInverse);
  post.uniforms.uCamWorld.value.copy(camera.matrixWorld);

  renderer.info.reset();
  // pass 1: normals + depth for the line pass (no grass/flowers); skipped when lines are off
  camera.layers.set(0);
  renderer.setRenderTarget(rtNormal); renderer.setClearColor(0x000000, 0); renderer.clear();
  if (post.uniforms.uLine.value > 0.5) { scene.overrideMaterial = normalMat; renderer.render(scene, camera); scene.overrideMaterial = null; }
  if (lowTier < 1) camera.layers.enable(1);
  // pass 2: colour (shadow map redrawn once per frame, here)
  renderer.shadowMap.needsUpdate = true;
  renderer.setRenderTarget(rtColor); renderer.clear();
  renderer.render(scene, camera);
  // pass 3: sky, lines, paper grain
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);

  // zone and landmark labels: shown only for things on the near side of the planet
  if (!labels.hidden) {
    const placeTag = (o, minUp) => {
      tagPos.copy(o.tagLocal).applyMatrix4(planet.matrixWorld);
      const vis = tagPos.y / tagPos.length() > minUp;
      tagPos.project(camera);
      const sy = (-tagPos.y * 0.5 + 0.5) * innerHeight;
      const show = vis && tagPos.z < 1 && Math.abs(tagPos.x) < 1.05 && sy > insetTop + 36 && sy < innerHeight + 20;
      o.tag.style.opacity = show ? '1' : '0';
      o.tag.style.pointerEvents = show && !o.tag.classList.contains('mini') ? 'auto' : 'none';
      if (show) o.tag.style.transform = `translate(${(tagPos.x * 0.5 + 0.5) * innerWidth}px, ${(-tagPos.y * 0.5 + 0.5) * innerHeight}px) translate(-50%, -100%)`;
    };
    zones.forEach(z => placeTag(z, W.tagCos[0]));
    LANDMARKS.forEach(m => placeTag(m, W.tagCos[1]));
  }

  company.placeTags();

  // fps + adaptive resolution (drops pixel ratio on slow GPUs, never below 1)
  frames++; fpsT += dt;
  if (fpsT >= 1) {
    fps = Math.round(frames / fpsT); frames = 0; fpsT = 0;
    slowSecs = fps < 45 ? slowSecs + 1 : 0;
    if (slowSecs >= 2 && pr > 1) { pr = Math.max(1, pr - 0.25); slowSecs = 0; resize(); }
    else if (slowSecs >= 3 && pr <= 1 && lowTier < 2) { slowSecs = 0; setLowTier(lowTier + 1); }
    const info = renderer.info.render;
    statsEl.innerHTML = `${fps} fps · 像素比 ${pr.toFixed(2)}${pr < prMax ? '（已自动降档）' : ''}<br>${info.calls} draw calls · ${(info.triangles / 1000).toFixed(0)}k 三角形<br>${gpuName || 'GPU 未公开'}`;
  }
}
// boot: build the first planet behind the veil, then walk to its first stop
{
  const start = /[?&]planet=ski\b/.test(location.search) ? 'ski' : 'hangzhou';
  loadWorld(start).then(() => {
    requestAnimationFrame(() => veil.classList.remove('on'));
    setTimeout(() => { if (!travel && activeZone === null) travelTo(0); }, 700);
  });
  frame();
}
</script>
</body>
</html>
